<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TubeGeny Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #141418;
            --neon-red: #ff4757;
            --neon-orange: #ff6b81;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 71, 87, 0.1) 0%, transparent 50%);
        }

        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            max-width: 900px;
            width: 95%;
            background: var(--card-bg);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Order Summary Side */
        .summary-side {
            background: linear-gradient(145deg, #1a1a20, #0f0f13);
            padding: 3rem;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .plan-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .plan-name {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, var(--text-main), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 1.5rem;
        }

        .price-amount {
            font-size: 2rem;
            font-weight: 800;
        }

        .benefits {
            list-style: none;
        }

        .benefits li {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .benefits i {
            color: #27c93f;
            margin-top: 3px;
        }

        /* Payment Side */
        .payment-side {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .payment-side h2 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-red);
            background: rgba(255, 71, 87, 0.05);
        }

        .card-element {
            display: flex;
            gap: 1rem;
        }

        .btn-pay {
            width: 100%;
            background: var(--text-main);
            color: var(--bg-dark);
            border: none;
            padding: 1.2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .secure-badge {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .summary-side {
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Summary Side -->
        <div class="summary-side">
            <div class="logo">
                <i class="fa-brands fa-youtube" style="color: var(--neon-red);"></i> TubeGeny
            </div>
            <p class="plan-title">Subscribe to</p>
            <h1 class="plan-name" id="plan-name">Pro Plan</h1>
            
            <div class="price-row">
                <span style="color: var(--text-muted);">Billed Monthly</span>
                <span class="price-amount" id="price-amount">$10.50</span>
            </div>

            <ul class="benefits" id="benefits-list">
                <li><i class="fa-solid fa-check"></i> Unlimited Channel Safety Scans</li>
                <li><i class="fa-solid fa-check"></i> Unlock AI Viral Blueprints</li>
                <li><i class="fa-solid fa-check"></i> 24/7 Demonetization Monitoring</li>
                <li><i class="fa-solid fa-check"></i> Cancel anytime, no questions asked</li>
            </ul>
        </div>

        <!-- Payment Side -->
        <div class="payment-side">
            <h2>Payment Details</h2>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" id="checkout-email">
            </div>

            <div class="input-group">
                <label>Card Information (Test Mode)</label>
                <input type="text" placeholder="Card Number (0000 0000 0000 0000)" id="checkout-card" maxlength="19">
            </div>
            
            <div class="card-element">
                <div class="input-group" style="flex: 1;">
                    <input type="text" placeholder="MM/YY">
                </div>
                <div class="input-group" style="flex: 1;">
                    <input type="text" placeholder="CVC">
                </div>
            </div>

            <button class="btn-pay" id="pay-btn">
                <span id="pay-btn-text">Pay $10.50</span>
            </button>

            <div class="secure-badge">
                <i class="fa-solid fa-lock"></i>
                Guaranteed safe & secure checkout powered by Stripe
            </div>
        </div>
    </div>

    <script>
        // Dynamic Plan Rendering
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'pro';
        
        const planNameEl = document.getElementById('plan-name');
        const priceAmountEl = document.getElementById('price-amount');
        const payBtnText = document.getElementById('pay-btn-text');
        const benefitsList = document.getElementById('benefits-list');

        if (plan === 'basic') {
            planNameEl.textContent = 'Basic Plan';
            priceAmountEl.textContent = '$3.50';
            payBtnText.textContent = 'Pay $3.50';
            benefitsList.innerHTML = `
                <li><i class="fa-solid fa-check"></i> 1 Channel Supported</li>
                <li><i class="fa-solid fa-check"></i> Manual Deep Scans (10/mo)</li>
                <li><i class="fa-solid fa-check"></i> Basic Safety Reports</li>
            `;
        }

        const payBtn = document.getElementById('pay-btn');
        payBtn.addEventListener('click', () => {
            const originalText = payBtn.innerHTML;
            payBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            payBtn.style.opacity = '0.8';
            payBtn.disabled = true;

            // Simulate Network Request
            setTimeout(() => {
                // Redirect back to main page with success query parameter
                window.location.href = `tubegeny.html?payment=success&plan=${plan}`;
            }, 1500);
        });

        // Simple formatter for card number
        const cardInput = document.getElementById('checkout-card');
        cardInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
        });
    </script>
</body>
</html>
